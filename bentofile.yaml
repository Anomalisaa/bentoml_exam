# bentofile.yaml
service: "src.service:svc"
description: "Admission Prediction Service (Linear Regression + JWT auth)"
labels:
  owner: "Isabell Gurstein"
  project: "AdmissionsPrediction"
include:
  - "src/"
  - "data/processed/"
docker:
  base_image: "python:3.8-slim"
python:
  packages:
    - scikit-learn
    - pandas
    - numpy
    - bentoml
    - python-dotenv
    - pyjwt
    - fastapi
    - uvicorn
    - joblib
    - requests